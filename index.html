<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js'
import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/examples/jsm/postprocessing/OutputPass.js'
import { FontLoader } from 'three/examples/jsm/loaders/FontLoader.js'
import { TextGeometry } from 'three/examples/jsm/geometries/TextGeometry.js'
import gsap from 'gsap'

/* ============================== utils/Random ============================== */
function randRange(min, max) { return min + Math.random() * (max - min) }
function randInt(min, max) { return Math.floor(randRange(min, max + 1)) }
function randChoice(array) { return array[randInt(0, array.length - 1)] }
function randOnSphere(radius) {
  const u = Math.random(), v = Math.random()
  const theta = 2 * Math.PI * u, phi = Math.acos(2 * v - 1)
  return { x: radius * Math.sin(phi) * Math.cos(theta), y: radius * Math.sin(phi) * Math.sin(theta), z: radius * Math.cos(phi) }
}
function clamp(value, min, max) { return Math.max(min, Math.min(max, value)) }

/* ============================== core/EventEmitter ============================== */
class EventEmitter {
  constructor() { this._callbacks = new Map() }
  on(event, callback) {
    if (!this._callbacks.has(event)) this._callbacks.set(event, [])
    this._callbacks.get(event).push(callback)
    return this
  }
  trigger(event, ...args) {
    if (!this._callbacks.has(event)) return this
    for (const cb of this._callbacks.get(event)) cb(...args)
    return this
  }
}

/* ============================== core/Sizes ============================== */
class Sizes extends EventEmitter {
  constructor() {
    super()
    this.width = window.innerWidth
    this.height = window.innerHeight
    this.pixelRatio = Math.min(window.devicePixelRatio, 2)
    window.addEventListener('resize', () => {
      this.width = window.innerWidth
      this.height = window.innerHeight
      this.pixelRatio = Math.min(window.devicePixelRatio, 2)
      this.trigger('resize')
    })
  }
  get aspect() { return this.width / this.height }
}

/* ============================== core/Time ============================== */
class Time extends EventEmitter {
  constructor() {
    super()
    this.start = performance.now()
    this.current = this.start
    this.elapsed = 0
    this.delta = 1 / 60
    const tick = (now) => {
      const rawDelta = (now - this.current) / 1000
      this.delta = Math.min(rawDelta, 1 / 30)
      this.current = now
      this.elapsed = (now - this.start) / 1000
      this.trigger('tick')
      requestAnimationFrame(tick)
    }
    requestAnimationFrame(tick)
  }
}

/* ============================== core/Scene ============================== */
class SceneWrapper {
  constructor() {
    this.instance = new THREE.Scene()
    this.instance.background = new THREE.Color(0x000000)
    this.instance.fog = new THREE.FogExp2(0x000000, 0.035)
  }
  add(o) { this.instance.add(o) }
  remove(o) { this.instance.remove(o) }
}

/* ============================== core/Camera ============================== */
class Camera {
  constructor(experience) {
    this.sizes = experience.sizes
    this.scene = experience.scene.instance
    this.canvas = experience.canvas
    this.instance = new THREE.PerspectiveCamera(35, this.sizes.aspect, 0.1, 200)
    this.instance.position.set(0, 0, 12)
    this.scene.add(this.instance)

    this.controls = new OrbitControls(this.instance, this.canvas)
    this.controls.enabled = false
    this.controls.enableDamping = true
    this.controls.dampingFactor = 0.06
    this.controls.enablePan = false
    this.controls.rotateSpeed = 0.5
    this.controls.zoomSpeed = 0.6
    this.controls.minDistance = 6
    this.controls.maxDistance = 16
    this.controls.minPolarAngle = 0.35
    this.controls.maxPolarAngle = Math.PI - 0.35
  }
  enableControls() { this.controls.enabled = true }
  resize() { this.instance.aspect = this.sizes.aspect; this.instance.updateProjectionMatrix() }
  update() { if (this.controls.enabled) this.controls.update() }
}

/* ============================== core/Renderer ============================== */
class Renderer {
  constructor(experience) {
    this.sizes = experience.sizes
    this.scene = experience.scene.instance
    this.camera = experience.camera
    this.canvas = experience.canvas

    this.instance = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: false, powerPreference: 'high-performance' })
    this.instance.setSize(this.sizes.width, this.sizes.height)
    this.instance.setPixelRatio(this.sizes.pixelRatio)
    this.instance.outputColorSpace = THREE.SRGBColorSpace
    this.instance.toneMapping = THREE.ACESFilmicToneMapping
    this.instance.toneMappingExposure = 1.1

    this.composer = new EffectComposer(this.instance)
    this.composer.setSize(this.sizes.width, this.sizes.height)
    this.composer.setPixelRatio(this.sizes.pixelRatio)
    this.composer.addPass(new RenderPass(this.scene, this.camera.instance))
    this.bloomPass = new UnrealBloomPass(new THREE.Vector2(this.sizes.width, this.sizes.height), 0.55, 0.6, 0.82)
    this.composer.addPass(this.bloomPass)
    this.composer.addPass(new OutputPass())
  }
  pulseBloom(targetStrength, duration = 0.4) {
    const start = this.bloomPass.strength
    const startTime = performance.now()
    const animate = () => {
      const t = Math.min((performance.now() - startTime) / (duration * 1000), 1)
      const eased = 1 - Math.pow(1 - t, 3)
      this.bloomPass.strength = start + (targetStrength - start) * eased
      if (t < 1) requestAnimationFrame(animate)
    }
    animate()
  }
  resize() {
    this.instance.setSize(this.sizes.width, this.sizes.height)
    this.instance.setPixelRatio(this.sizes.pixelRatio)
    this.composer.setSize(this.sizes.width, this.sizes.height)
    this.composer.setPixelRatio(this.sizes.pixelRatio)
  }
  update() { this.composer.render() }
}

/* ============================== world/Lights ============================== */
class Lights {
  constructor(experience) {
    this.scene = experience.scene
    this.ambient = new THREE.AmbientLight(0x2a1520, 0.6)
    this.scene.add(this.ambient)
    this.keyLight = new THREE.PointLight(0xff5c8a, 12, 30, 2)
    this.keyLight.position.set(3, 2, 6)
    this.scene.add(this.keyLight)
    this.rimLight = new THREE.PointLight(0xff2d55, 8, 40, 2)
    this.rimLight.position.set(-4, -2, -6)
    this.scene.add(this.rimLight)
    this.fillLight = new THREE.DirectionalLight(0xffffff, 0.25)
    this.fillLight.position.set(0, 5, 5)
    this.scene.add(this.fillLight)
  }
  pulse(mult) { this.keyLight.intensity = 12 * mult; this.rimLight.intensity = 8 * mult }
}

/* ============================== utils/Performance ============================== */
class PerformanceMonitor {
  constructor(time) {
    this.time = time
    const cores = navigator.hardwareConcurrency || 4
    const isMobile = /Mobi|Android/i.test(navigator.userAgent)
    this.tier = (isMobile && cores <= 4) ? 2 : (isMobile || cores <= 4) ? 1 : 0
    this._frames = 0; this._elapsedSinceCheck = 0; this._evaluated = false
    this.time.on('tick', () => {
      if (this._evaluated) return
      this._frames += 1
      this._elapsedSinceCheck += this.time.delta
      if (this._elapsedSinceCheck >= 2) {
        const fps = this._frames / this._elapsedSinceCheck
        if (fps < 35) this.tier = Math.min(this.tier + 1, 2)
        else if (fps > 55 && this.tier > 0) this.tier -= 1
        this._evaluated = true
      }
    })
  }
  get particleMultiplier() { return [1, 0.55, 0.3][this.tier] }
}

/* ============================== utils/WordFactory ============================== */
const FONT_URL = 'https://unpkg.com/three@0.165.0/examples/fonts/helvetiker_regular.typeface.json'
const geometryCache = new Map()
let fontPromise = null

function loadFont() {
  if (!fontPromise) {
    fontPromise = fetch(FONT_URL).then((r) => r.json()).then((data) => new FontLoader().parse(data))
  }
  return fontPromise
}
function getGeometry(font, text, size, depth) {
  const key = `${text}__${size}__${depth}`
  if (geometryCache.has(key)) return geometryCache.get(key)
  const geometry = new TextGeometry(text, { font, size, depth, curveSegments: 6, bevelEnabled: true, bevelThickness: depth * 0.18, bevelSize: depth * 0.1, bevelSegments: 2 })
  geometry.center()
  geometry.computeVertexNormals()
  geometryCache.set(key, geometry)
  return geometry
}
const MATERIAL_TONES = {
  red: { color: 0xff2d55, emissive: 0x53000f, emissiveIntensity: 0.35 },
  pink: { color: 0xff7fa8, emissive: 0x4a0d20, emissiveIntensity: 0.3 },
  white: { color: 0xfdf3f5, emissive: 0x330014, emissiveIntensity: 0.18 },
}
function createMaterial(tone = 'pink') {
  const s = MATERIAL_TONES[tone] ?? MATERIAL_TONES.pink
  return new THREE.MeshPhysicalMaterial({ color: s.color, emissive: s.emissive, emissiveIntensity: s.emissiveIntensity, roughness: 0.35, metalness: 0.1, clearcoat: 0.6, clearcoatRoughness: 0.3 })
}
const WordFactory = {
  preload: () => loadFont(),
  async createWordMesh(text, { size = 0.5, depth = 0.14, tone = 'pink' } = {}) {
    const font = await loadFont()
    const geometry = getGeometry(font, text, size, depth)
    const mesh = new THREE.Mesh(geometry, createMaterial(tone))
    mesh.castShadow = true
    mesh.receiveShadow = true
    return mesh
  },
}

/* ============================== world/IntroTunnel ============================== */
class IntroTunnel {
  constructor(experience) {
    this.scene = experience.scene
    this.performance = experience.performance
    this.count = Math.floor(2400 * this.performance.particleMultiplier)
    this.depth = 60
    this.radius = 5
    this._speed = 0

    this.geometry = new THREE.BufferGeometry()
    const positions = new Float32Array(this.count * 3)
    const sizes = new Float32Array(this.count)
    const seeds = new Float32Array(this.count)
    for (let i = 0; i < this.count; i++) {
      const i3 = i * 3
      const r = randRange(0.4, this.radius) * Math.sqrt(Math.random())
      const angle = randRange(0, Math.PI * 2)
      positions[i3] = Math.cos(angle) * r
      positions[i3 + 1] = Math.sin(angle) * r
      positions[i3 + 2] = -randRange(0, this.depth)
      sizes[i] = randRange(0.6, 2.6)
      seeds[i] = Math.random()
    }
    this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3))
    this.geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1))
    this.geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1))

    this.material = new THREE.ShaderMaterial({
      uniforms: {
        uColorA: { value: new THREE.Color(0xff9fc0) },
        uColorB: { value: new THREE.Color(0xff2d55) },
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
        uOpacity: { value: 0 },
      },
      vertexShader: `
        attribute float aSize;
        attribute float aSeed;
        uniform float uPixelRatio;
        varying float vSeed;
        varying float vDepth;
        void main() {
          vSeed = aSeed;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          vDepth = clamp(1.0 - (-mvPosition.z / 60.0), 0.0, 1.0);
          gl_PointSize = aSize * uPixelRatio * (40.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform vec3 uColorA;
        uniform vec3 uColorB;
        uniform float uOpacity;
        varying float vSeed;
        varying float vDepth;
        void main() {
          float d = distance(gl_PointCoord, vec2(0.5));
          if (d > 0.5) discard;
          float glow = smoothstep(0.5, 0.0, d);
          vec3 color = mix(uColorA, uColorB, vSeed);
          float alpha = glow * uOpacity * (0.3 + vDepth * 0.9);
          gl_FragColor = vec4(color, alpha);
        }
      `,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    })
    this.points = new THREE.Points(this.geometry, this.material)
    this.points.frustumCulled = false
    this.scene.add(this.points)
  }
  setSpeed(speed) { this._speed = speed }
  setOpacity(opacity) { this.material.uniforms.uOpacity.value = opacity }
  update(delta) {
    if (this._speed <= 0) return
    const positions = this.geometry.attributes.position.array
    const advance = this._speed * delta
    for (let i = 0; i < this.count; i++) {
      const i3 = i * 3
      positions[i3 + 2] += advance
      if (positions[i3 + 2] > 2) {
        const r = randRange(0.4, this.radius) * Math.sqrt(Math.random())
        const angle = randRange(0, Math.PI * 2)
        positions[i3] = Math.cos(angle) * r
        positions[i3 + 1] = Math.sin(angle) * r
        positions[i3 + 2] = -this.depth
      }
    }
    this.geometry.attributes.position.needsUpdate = true
  }
}

/* ============================== world/MatrixRain ============================== */
function createLoveTexture() {
  const canvas = document.createElement('canvas')
  canvas.width = 128; canvas.height = 128
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = '#ff5c8a'
  ctx.font = '700 34px "Marcellus", serif'
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 18
  ctx.fillText('LOVE', canvas.width / 2, canvas.height / 2)
  const texture = new THREE.CanvasTexture(canvas)
  texture.colorSpace = THREE.SRGBColorSpace
  return texture
}
class MatrixRain {
  constructor(experience) {
    this.scene = experience.scene
    this.performance = experience.performance
    this._layers = []
    this._texture = createLoveTexture()

    const layerConfigs = [
      { z: -14, span: 26, count: 90, speed: 1.2, opacity: 0.18, scale: 0.5 },
      { z: -9, span: 20, count: 70, speed: 1.9, opacity: 0.32, scale: 0.7 },
      { z: -5, span: 15, count: 50, speed: 2.8, opacity: 0.5, scale: 1 },
    ]
    layerConfigs.forEach((config) => {
      const count = Math.max(8, Math.floor(config.count * this.performance.particleMultiplier))
      const geometry = new THREE.PlaneGeometry(config.scale, config.scale)
      const material = new THREE.MeshBasicMaterial({ map: this._texture, transparent: true, opacity: config.opacity, depthWrite: false, blending: THREE.AdditiveBlending })
      const mesh = new THREE.InstancedMesh(geometry, material, count)
      mesh.frustumCulled = false
      const speeds = new Float32Array(count), phases = new Float32Array(count), columnsX = new Float32Array(count)
      const dummy = new THREE.Object3D()
      for (let i = 0; i < count; i++) {
        speeds[i] = config.speed * (0.7 + Math.random() * 0.6)
        phases[i] = Math.random() * 20
        columnsX[i] = (Math.random() - 0.5) * config.span
        dummy.position.set(columnsX[i], phases[i], config.z)
        dummy.updateMatrix()
        mesh.setMatrixAt(i, dummy.matrix)
      }
      this.scene.add(mesh)
      this._layers.push({ mesh, speeds, phases, columnsX, z: config.z, span: config.span, count, halfHeight: 12 })
    })
  }
  update(delta) {
    const dummy = new THREE.Object3D()
    for (const layer of this._layers) {
      for (let i = 0; i < layer.count; i++) {
        layer.phases[i] -= layer.speeds[i] * delta
        if (layer.phases[i] < -layer.halfHeight) {
          layer.phases[i] = layer.halfHeight
          layer.columnsX[i] = (Math.random() - 0.5) * layer.span
        }
        dummy.position.set(layer.columnsX[i], layer.phases[i], layer.z)
        dummy.updateMatrix()
        layer.mesh.setMatrixAt(i, dummy.matrix)
      }
      layer.mesh.instanceMatrix.needsUpdate = true
    }
  }
}

/* ============================== world/Questions ============================== */
class Questions {
  constructor({ onYes }) {
    this.onYes = onYes
    this.stageEl = document.getElementById('stage-question-one')
    this.actionsEl = this.stageEl.querySelector('.stage__actions')
    this.yesBtn = document.getElementById('btn-yes-one')
    this.noBtn = document.getElementById('btn-no-one')
    this._yesScale = 1
    this._lastBehavior = -1

    const onNoInteract = (event) => {
      event.preventDefault()
      this._growYes()
      this._reactNoButton()
    }
    this.noBtn.addEventListener('pointerenter', onNoInteract)
    this.noBtn.addEventListener('click', onNoInteract)
    this.yesBtn.addEventListener('click', (event) => {
      event.preventDefault()
      this.hide()
      this.onYes?.()
    })
  }
  show() { this.stageEl.classList.add('is-active') }
  hide() { this.stageEl.classList.remove('is-active') }
  _growYes() {
    this._yesScale = Math.min(this._yesScale + 0.06, 1.9)
    gsap.to(this.yesBtn, { scale: this._yesScale, duration: 0.45, ease: 'back.out(2)' })
  }
  _reactNoButton() {
    const behaviors = ['teleport', 'flee', 'spin', 'shrink', 'orbit']
    let behavior = randChoice(behaviors)
    while (behavior === this._lastBehavior && behaviors.length > 1) behavior = randChoice(behaviors)
    this._lastBehavior = behavior

    const bounds = this.actionsEl.getBoundingClientRect()
    const maxX = bounds.width / 2 - 60
    const maxY = bounds.height / 2 - 20

    if (behavior === 'teleport') {
      const x = randRange(-maxX, maxX), y = randRange(-maxY * 1.4, maxY * 1.4)
      gsap.to(this.noBtn, { x, y, duration: 0.01, onComplete: () => gsap.fromTo(this.noBtn, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(3)' }) })
    } else if (behavior === 'flee') {
      gsap.to(this.noBtn, { x: randRange(-maxX, maxX), y: randRange(-maxY, maxY), duration: 0.5, ease: 'power3.out' })
    } else if (behavior === 'spin') {
      gsap.to(this.noBtn, { rotate: `+=${randInt(180, 720)}`, duration: 0.8, ease: 'power2.inOut' })
    } else if (behavior === 'shrink') {
      gsap.to(this.noBtn, { scale: randRange(0.35, 0.6), duration: 0.4, ease: 'power2.out', yoyo: true, repeat: 1, repeatDelay: 0.3 })
    } else if (behavior === 'orbit') {
      const radius = randRange(60, Math.min(maxX, maxY)), angle = randRange(0, Math.PI * 2)
      gsap.to(this.noBtn, { x: Math.cos(angle) * radius, y: Math.sin(angle) * radius, duration: 0.6, ease: 'sine.inOut' })
    }
  }
}

/* ============================== world/Slider ============================== */
class Slider {
  constructor({ onComplete }) {
    this.onComplete = onComplete
    this.stageEl = document.getElementById('stage-slider')
    this.trackEl = document.getElementById('slider-track')
    this.fillEl = document.getElementById('slider-fill')
    this.handleEl = document.getElementById('slider-handle')
    this.valueEl = document.getElementById('slider-value')
    this._value = 0; this._dragging = false; this._completed = false

    const onMove = (event) => { if (this._dragging) this._updateFromEvent(event) }
    const onUp = (event) => {
      this._dragging = false
      window.removeEventListener('pointermove', onMove)
      window.removeEventListener('pointerup', onUp)
      this.trackEl.releasePointerCapture?.(event.pointerId)
    }
    this.trackEl.addEventListener('pointerdown', (event) => {
      this._dragging = true
      this.trackEl.setPointerCapture(event.pointerId)
      window.addEventListener('pointermove', onMove)
      window.addEventListener('pointerup', onUp)
      this._updateFromEvent(event)
    })
  }
  show() { this._value = 0; this._completed = false; this._render(); this.stageEl.classList.add('is-active') }
  hide() { this.stageEl.classList.remove('is-active') }
  _updateFromEvent(event) {
    const bounds = this.trackEl.getBoundingClientRect()
    const ratio = clamp((event.clientX - bounds.left) / bounds.width, 0, 1)
    this._value = Math.round(ratio * 100)
    this._render()
    if (this._value >= 100 && !this._completed) { this._completed = true; this._onFilled() }
  }
  _render() {
    this.fillEl.style.width = `${this._value}%`
    this.handleEl.style.left = `${this._value}%`
    this.valueEl.textContent = `${this._value}%`
  }
  _onFilled() {
    gsap.to(this.valueEl, { scale: 1.3, duration: 0.25, yoyo: true, repeat: 1, ease: 'power2.out' })
    this.hide()
    this.onComplete?.()
  }
}

/* ============================== world/WordExplosion ============================== */
const HEART_WORDS = ['love', 'always', 'forever', 'kiss', 'mine', 'my love', 'beautiful', 'together', 'destiny', 'heart', 'happy']

class WordExplosion {
  constructor(experience) { this.scene = experience.scene; this.renderer = experience.renderer }

  async play({ heartWordCount = 110, floatingWordCount = 24 } = {}) {
    const loveMesh = await WordFactory.createWordMesh('LOVE', { size: 2.4, depth: 0.5, tone: 'red' })
    loveMesh.scale.setScalar(0.001)
    loveMesh.position.set(0, 0, 0)
    this.scene.add(loveMesh)

    await new Promise((resolve) => gsap.to(loveMesh.scale, { x: 1, y: 1, z: 1, duration: 1.1, ease: 'power3.out', onComplete: resolve }))
    await new Promise((resolve) => setTimeout(resolve, 2000))

    this.renderer.pulseBloom(1.4, 0.25)
    setTimeout(() => this.renderer.pulseBloom(0.55, 0.9), 250)

    await new Promise((resolve) => {
      gsap.to(loveMesh.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 0.6, ease: 'power2.in', onComplete: () => { this.scene.remove(loveMesh); loveMesh.geometry?.dispose?.(); resolve() } })
    })

    const total = heartWordCount + floatingWordCount
    const allMeshes = await this._spawnFragments(total)
    return { heartWords: allMeshes.slice(0, heartWordCount), floatingWords: allMeshes.slice(heartWordCount) }
  }

  async _spawnFragments(count) {
    const meshes = []
    for (let i = 0; i < count; i++) {
      const text = HEART_WORDS[i % HEART_WORDS.length]
      const tone = i % 3 === 0 ? 'white' : i % 3 === 1 ? 'pink' : 'red'
      const mesh = await WordFactory.createWordMesh(text, { size: 0.34, depth: 0.1, tone })
      mesh.userData.tone = tone
      const spread = randOnSphere(0.6 + Math.random() * 2.2)
      mesh.position.set(spread.x, spread.y, spread.z)
      mesh.rotation.set(Math.random() * 0.6, Math.random() * Math.PI * 2, Math.random() * 0.6)
      mesh.scale.setScalar(0.001)
      this.scene.add(mesh)
      meshes.push(mesh)
      gsap.to(mesh.scale, { x: 1, y: 1, z: 1, duration: 0.6, delay: Math.random() * 0.4, ease: 'back.out(2)' })
    }
    return meshes
  }
}

/* ============================== animations/HeartAnimation ============================== */
class HeartAnimation {
  constructor(lights) { this.lights = lights; this._tween = null; this._meshes = [] }
  start(meshes) {
    this._meshes = meshes
    const scaleTarget = { value: 1 }
    this._tween = gsap.to(scaleTarget, {
      value: 1.045, duration: 0.55, ease: 'sine.inOut', yoyo: true, repeat: -1,
      onUpdate: () => { for (const m of this._meshes) m.scale.setScalar(scaleTarget.value); this.lights?.pulse(scaleTarget.value) },
    })
  }
}

/* ============================== world/HeartBuilder ============================== */
const BOUNDARY_SAMPLES = 240
const HEART_SCALE = 1 / 5.4
function heartBoundaryPoint(t) {
  const x = 16 * Math.sin(t) ** 3
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
  return { x: x * HEART_SCALE, y: y * HEART_SCALE }
}
function buildBoundary() {
  const points = []
  for (let i = 0; i < BOUNDARY_SAMPLES; i++) points.push(heartBoundaryPoint((i / BOUNDARY_SAMPLES) * Math.PI * 2))
  return points
}
function isInsideHeart(boundary, x, y) {
  let inside = false
  for (let i = 0, j = boundary.length - 1; i < boundary.length; j = i++) {
    const xi = boundary[i].x, yi = boundary[i].y, xj = boundary[j].x, yj = boundary[j].y
    const intersects = (yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi
    if (intersects) inside = !inside
  }
  return inside
}
function sampleFilledHeart(boundary) {
  for (let attempt = 0; attempt < 60; attempt++) {
    const x = randRange(-3, 3), y = randRange(-3, 3)
    if (isInsideHeart(boundary, x, y)) return { x, y }
  }
  return { x: 0, y: 0 }
}
class HeartBuilder {
  constructor(experience) {
    this.scene = experience.scene
    this.lights = experience.lights
    this._boundary = buildBoundary()
    this.heartAnimation = new HeartAnimation(this.lights)
  }
  async build(words, { onComplete } = {}) {
    const layerZ = { red: 0.35, pink: 0, white: -0.35 }
    const targets = words.map((mesh) => {
      const { x, y } = sampleFilledHeart(this._boundary)
      const tone = mesh.userData.tone ?? 'pink'
      const z = layerZ[tone] + randRange(-0.06, 0.06)
      return { mesh, position: { x, y, z } }
    })

    const timeline = gsap.timeline()
    targets.forEach(({ mesh, position }, index) => {
      const delay = randRange(0, 1.6) + index * 0.006
      timeline.to(mesh.position, { x: position.x, y: position.y, z: position.z, duration: randRange(1.3, 2.0), ease: 'power3.inOut' }, delay)
      timeline.to(mesh.rotation, { x: 0, y: 0, z: 0, duration: randRange(1.3, 2.0), ease: 'power3.inOut' }, delay)
    })

    await new Promise((resolve) => timeline.eventCallback('onComplete', resolve))
    this.heartAnimation.start(words)
    onComplete?.()
  }
}

/* ============================== world/FloatingWords ============================== */
class FloatingWords {
  constructor() { this._items = [] }
  setWords(meshes) {
    this._items = meshes.map((mesh) => ({
      mesh,
      angleXY: Math.random() * Math.PI * 2,
      speed: randRange(0.04, 0.12) * (Math.random() > 0.5 ? 1 : -1),
      bobSpeed: randRange(0.3, 0.8),
      bobAmount: randRange(0.15, 0.4),
      spinSpeed: randRange(-0.3, 0.3),
      basePosition: mesh.position.clone(),
    }))
  }
  update(elapsed, delta) {
    for (const item of this._items) {
      item.angleXY += item.speed * delta
      const x = item.basePosition.x + Math.cos(item.angleXY) * 0.6
      const y = item.basePosition.y + Math.sin(elapsed * item.bobSpeed) * item.bobAmount
      const z = item.basePosition.z + Math.sin(item.angleXY) * 0.6
      item.mesh.position.set(x, y, z)
      item.mesh.rotation.y += item.spinSpeed * delta
    }
  }
}

/* ============================== animations/IntroAnimation ============================== */
class IntroAnimation {
  constructor(tunnel) { this.tunnel = tunnel }
  play({ onComplete } = {}) {
    const proxy = { speed: 0, opacity: 0 }
    const timeline = gsap.timeline({ onComplete: () => onComplete?.() })
    timeline.to(proxy, { opacity: 1, duration: 0.8, ease: 'power1.out', onUpdate: () => this.tunnel.setOpacity(proxy.opacity) })
    timeline.to(proxy, { speed: 34, duration: 2.1, ease: 'power2.in', onUpdate: () => this.tunnel.setSpeed(proxy.speed) }, 0.1)
    timeline.to(proxy, { speed: 0, duration: 1.6, ease: 'power3.out', onUpdate: () => this.tunnel.setSpeed(proxy.speed) })
    timeline.to(proxy, { opacity: 0, duration: 1.1, ease: 'power1.inOut', onUpdate: () => this.tunnel.setOpacity(proxy.opacity) }, '-=0.5')
    return timeline
  }
  burst() {
    const proxy = { opacity: 0 }
    this.tunnel.setSpeed(18)
    gsap.to(proxy, { opacity: 0.8, duration: 0.3, yoyo: true, repeat: 1, onUpdate: () => this.tunnel.setOpacity(proxy.opacity), onComplete: () => this.tunnel.setSpeed(0) })
  }
}

/* ============================== core/Experience ============================== */
class Experience {
  constructor(canvas) {
    this.canvas = canvas
    this.sizes = new Sizes()
    this.time = new Time()
    this.scene = new SceneWrapper()
    this.performance = new PerformanceMonitor(this.time)
    this.camera = new Camera(this)
    this.renderer = new Renderer(this)
    this.lights = new Lights(this)
    this.tunnel = new IntroTunnel(this)
    this.matrixRain = new MatrixRain(this)
    this.introAnimation = new IntroAnimation(this.tunnel)
    this.wordExplosion = new WordExplosion(this)
    this.heartBuilder = new HeartBuilder(this)
    this.floatingWords = new FloatingWords()

    this.sizes.on('resize', () => { this.camera.resize(); this.renderer.resize() })
    this.time.on('tick', () => this._onTick())

    this._boot()
  }

  async _boot() {
    const barFill = document.getElementById('loading-bar-fill')
    if (barFill) barFill.style.width = '35%'
    await WordFactory.preload()
    if (barFill) barFill.style.width = '100%'
    setTimeout(() => document.getElementById('loading-screen')?.classList.add('is-hidden'), 200)
    this.introAnimation.play({ onComplete: () => this._showQuestionOne() })
  }

  _showQuestionOne() {
    this.questions = new Questions({ onYes: () => this._showSlider() })
    this.questions.show()
  }
  _showSlider() {
    this.slider = new Slider({ onComplete: () => this._onSliderComplete() })
    this.slider.show()
  }
  _onSliderComplete() {
    this.introAnimation.burst()
    setTimeout(() => this._playWordExplosion(), 500)
  }
  async _playWordExplosion() {
    const { heartWords, floatingWords } = await this.wordExplosion.play({ heartWordCount: 110, floatingWordCount: 24 })
    this.floatingWords.setWords(floatingWords)
    this.heartBuilder.build(heartWords, { onComplete: () => this.camera.enableControls() })
  }
  _onTick() {
    const { delta, elapsed } = this.time
    this.tunnel.update(delta)
    this.matrixRain.update(delta)
    this.floatingWords.update(elapsed, delta)
    this.camera.update()
    this.renderer.update()
  }
}

const canvas = document.getElementById('webgl')
window.__infinityLoveExperience = new Experience(canvas)
