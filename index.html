
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Do you love me?</title>
  <style>
    html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
    /* UI overlays */
    .center-ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none}
    .panel{background:#000;border:5px double #fff;padding:28px 22px;text-align:center;pointer-events:auto;box-shadow:10px 10px 0 rgba(0,0,0,0.6);max-width:92%;color:#fff}
    .title{font-family:'Press Start 2P',monospace;font-size:14px;margin:0 0 18px 0}
    .btn-row{display:flex;gap:24px;justify-content:center}
    .btn{background:transparent;color:#fff;border:4px outset #fff;padding:10px 18px;cursor:pointer;font-family:'Press Start 2P',monospace}
    .btn:hover{background:#fff;color:#000;border:4px inset #fff}
    .hidden{display:none !important}
    /* percent modal elements */
    .slider{width:360px;height:34px;background:#150014;border:3px solid #ff66cc;margin:14px auto;position:relative;cursor:pointer}
    .fill{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,#ff3399,#ffccff)}
    .thumb{position:absolute;left:0;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #ff3399;transition:border-color 0.1s ease}
    .percent{color:#ffccff;margin-top:8px;font-size:16px}
    
    /* UI overlay for instructions */
    .bottom-hint {position:fixed;bottom:30px;left:0;width:100%;text-align:center;color:#fff;font-family:'Press Start 2P',monospace;font-size:11px;z-index:30;pointer-events:none;letter-spacing:1px;line-height:1.6}
    .blink {animation:blink-animation 1.5s steps(2, start) infinite}
    @keyframes blink-animation { to { visibility: hidden; } }
  </style>
  <!-- Font for UI (keeps original aesthetic) -->
  <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
  <!-- UI: initial question -->
  <div class="center-ui" id="uiStart">
    <div class="panel" id="panelStart">
      <h1 class="title">DO YOU LOVE ME?</h1>
      <div class="btn-row">
        <button class="btn" id="btnYes">YES</button>
        <button class="btn" id="btnNo">NO</button>
      </div>
    </div>
  </div>

  <!-- Percent modal -->
  <div class="center-ui hidden" id="uiPercent">
    <div class="panel">
      <h1 class="title" style="font-size:13px">QUANTO VOCÊ ME AMA?</h1>
      <div class="slider" id="slider">
        <div class="fill" id="fill"></div>
        <div class="thumb" id="thumb"></div>
      </div>
      <div class="percent" id="pct">0%</div>
      <div style="margin-top:12px"><button class="btn" id="btnContinue">Continuar</button></div>
    </div>
  </div>

  <!-- Confirm modal -->
  <div class="center-ui hidden" id="uiConfirm">
    <div class="panel" id="panelConfirm">
      <h1 class="title" id="confirmText">VOCÊ REALMENTE ME AMA 0%?</h1>
      <div class="btn-row" style="margin-top:18px">
        <button class="btn" id="confirmYes">SIM</button>
        <button class="btn" id="confirmNo">NÃO</button>
      </div>
    </div>
  </div>

  <!-- Bottom interactive hint overlay -->
  <div class="bottom-hint hidden blink" id="bottomHint"></div>

  <!-- three.js canvas will be injected programmatically -->

  <script type="module">
    // Reescrita completa: three.js module-based implementation
    import * as THREE from 'https://unpkg.com';
    import { OrbitControls } from 'https://unpkg.com';
    import { FontLoader } from 'https://unpkg.com';
    import { TextGeometry } from 'https://unpkg.com';

    // --- Configuráveis ---
    const WORD = 'LOVE ME';
    const WORD_COUNT = 280; // centenas, equilibrando qualidade/performance
    const TUNNEL_RADIUS = Math.min(window.innerWidth, window.innerHeight) * 0.35;
    const TUNNEL_LENGTH = 4000; // comprimento cíclico em unidades
    const WORD_HEIGHT = 8; // font size
    const EXTRUDE_DEPTH = 2.8; // depth extrusion
    const BEVEL_SIZE = 0.35;
    const TUNNEL_COLUMN_COUNT = 22; // number of vertical columns around camera
    const WORDS_PER_COLUMN = Math.ceil(WORD_COUNT / TUNNEL_COLUMN_COUNT);

    // --- UI refs ---
    const uiStart = document.getElementById('uiStart');
    const uiPercent = document.getElementById('uiPercent');
    const uiConfirm = document.getElementById('uiConfirm');
    const btnYes = document.getElementById('btnYes');
    const btnNo = document.getElementById('btnNo');
    const slider = document.getElementById('slider');
    const fill = document.getElementById('fill');
    const thumb = document.getElementById('thumb');
    const pct = document.getElementById('pct');
    const btnContinue = document.getElementById('btnContinue');
    const confirmText = document.getElementById('confirmText');
    const confirmYes = document.getElementById('confirmYes');
    const confirmNo = document.getElementById('confirmNo');
    const bottomHint = document.getElementById('bottomHint');

    let lovePercentage = 0;

    // --- EXECUÇÃO IMEDIATA DOS CLIQUES (CORREÇÃO CRÍTICA) ---
    btnYes.addEventListener('click', () => {
      uiStart.classList.add('hidden');
      uiPercent.classList.remove('hidden');
    });

    function moverBotaoNo() {
      btnNo.style.position = 'absolute';
      btnNo.style.top = Math.random() * 70 + 15 + '%';
      btnNo.style.left = Math.random() * 70 + 15 + '%';
    }
    btnNo.addEventListener('mouseover', moverBotaoNo);
    btnNo.addEventListener('click', moverBotaoNo);

    btnContinue.addEventListener('click', () => {
      uiPercent.classList.add('hidden');
      if (lovePercentage < 100) {
        confirmText.innerText = `VOCÊ REALMENTE ME AMA APENAS ${lovePercentage}%?`;
        uiConfirm.classList.remove('hidden');
      } else {
        startTunnelAnimation();
      }
    });

    confirmYes.addEventListener('click', () => {
      uiConfirm.classList.add('hidden');
      startTunnelAnimation();
    });

    confirmNo.addEventListener('click', () => {
      uiConfirm.classList.add('hidden');
      uiPercent.classList.remove('hidden');
    });

    // Slider interactive mechanics
    let isDragging = false;
    function updateSlider(e) {
      const rect = slider.getBoundingClientRect();
      const clientX = e.touches ? e.touches.clientX : e.clientX;
      let offsetX = clientX - rect.left;
      offsetX = Math.max(0, Math.min(offsetX, rect.width));
      lovePercentage = Math.round((offsetX / rect.width) * 100);
      
      fill.style.width = lovePercentage + '%';
      thumb.style.left = lovePercentage + '%';
      pct.innerText = lovePercentage + '%';

      // Pink (HSL 330) to Red (HSL 0) transition logic
      const hue = 330 - (lovePercentage * 3.3);
      const currentColor = `hsl(${hue}, 100%, 60%)`;
      
      fill.style.background = currentColor;
      thumb.style.borderColor = currentColor;
      pct.style.color = `hsl(${hue}, 100%, 85%)`;
    }

    slider.addEventListener('mousedown', (e) => { isDragging = true; updateSlider(e); });
    window.addEventListener('mousemove', (e) => { if (isDragging) updateSlider(e); });
    window.addEventListener('mouseup', () => isDragging = false);
    slider.addEventListener('touchstart', (e) => { isDragging = true; updateSlider(e); });
    window.addEventListener('touchmove', (e) => { if (isDragging) updateSlider(e); });
    window.addEventListener('touchend', () => isDragging = false);

    function startTunnelAnimation() {
      uiStart.classList.add('hidden');
      uiPercent.classList.add('hidden');
      uiConfirm.classList.add('hidden');
      
      bottomHint.innerText = "TOQUE NA TELA PARA AVANÇAR";
      bottomHint.classList.remove('hidden');
      
      camera.position.set(0, 0, 200);
      animationState = 'tunnel';
      stateTime = 0;
      clock.getDelta();
    }

    // Global pointer listener to step out of the loop tunnel and build the heart
    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName === 'BUTTON' || isDragging || e.target.closest('.panel')) return;

      if (animationState === 'tunnel') {
        animationState = 'assembleHeart';
        stateTime = 0;
        bottomHint.classList.add('hidden');
        
        wordMeshes.forEach((mesh, idx) => {
          originalPositions[idx].pos.copy(mesh.position);
          originalPositions[idx].rot.copy(mesh.rotation);
        });
      }
    });

    // --- three.js basic setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 10000);
    camera.position.set(0, 0, 0); // camera will move forward along -z axis

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // Lighting - designed to emphasize extrusion depth
    const ambient = new THREE.AmbientLight(0xffffff, 0.25);
    scene.add(ambient);
    const dir = new THREE.DirectionalLight(0xffe6f5, 0.9);
    dir.position.set(50, 80, 100);
    scene.add(dir);
    const rim = new THREE.DirectionalLight(0xffb3e6, 0.45);
    rim.position.set(-60, -40, -60);
    scene.add(rim);

    // Controls are disabled until heart formed
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled = false;
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = false;

    // Groups
