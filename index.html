<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Infinity Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=Marcellus&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --color-bg: #000000;
    --color-pink: #ff5c8a;
    --color-pink-soft: #ff9fc0;
    --color-red: #ff2d55;
    --color-white: #f5f0f2;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: var(--color-bg); overflow: hidden;
    font-family: 'Cormorant Garamond', serif; color: var(--color-white);
    -webkit-tap-highlight-color: transparent;
  }
  #webgl { position: fixed; inset: 0; outline: none; touch-action: none; }

  #loading-screen {
    position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.5rem; background: var(--color-bg);
    transition: opacity 1s var(--ease), visibility 1s var(--ease);
  }
  #loading-screen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loading-screen__mark {
    font-family: 'Marcellus', serif; letter-spacing: 0.5em; font-size: 0.85rem;
    color: var(--color-pink-soft); text-indent: 0.5em;
  }
  .loading-screen__bar { width: 180px; height: 1px; background: rgba(255,255,255,0.15); overflow: hidden; }
  .loading-screen__bar-fill { height: 100%; width: 0%; background: var(--color-pink); transition: width 0.2s linear; }

  #ui-root { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .stage {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2.4rem; opacity: 0; visibility: hidden;
    pointer-events: none; transition: opacity 1.1s var(--ease); padding: 0 1.2rem; text-align: center;
  }
  .stage.is-active { opacity: 1; visibility: visible; pointer-events: auto; }
  .stage__title {
    font-family: 'Cormorant Garamond', serif; font-weight: 300; font-style: italic;
    font-size: clamp(1.5rem, 6vw, 3.2rem); letter-spacing: 0.02em;
    text-shadow: 0 0 30px rgba(255, 92, 138, 0.45);
  }
  .stage__actions { position: relative; width: min(92vw, 420px); height: 110px; }
  .btn {
    position: absolute; top: 50%; left: 0;
    width: 130px; height: 48px; margin-left: -65px; margin-top: -24px;
    border: 1px solid rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.04);
    color: var(--color-white); font-family: 'Marcellus', serif; font-size: 0.95rem;
    letter-spacing: 0.06em; border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(6px); touch-action: manipulation;
    display: flex; align-items: center; justify-content: center; gap: 0.35rem;
  }
  .btn--yes { left: 28%; border-color: rgba(255, 92, 138, 0.6); box-shadow: 0 0 24px rgba(255, 92, 138, 0.25); z-index: 2; }
  .btn--no { left: 72%; z-index: 2; }

  .slider { width: min(88vw, 380px); display: flex; flex-direction: column; align-items: center; gap: 1.3rem; }
  .slider__track { position: relative; width: 100%; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.15); touch-action: none; cursor: pointer; }
  .slider__fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--color-pink), var(--color-red)); box-shadow: 0 0 16px rgba(255,45,85,0.6); }
  .slider__handle { position: absolute; top: 50%; left: 0%; width: 22px; height: 22px; border-radius: 50%; background: var(--color-white); box-shadow: 0 0 18px rgba(255,92,138,0.8); transform: translate(-50%, -50%); }
  .slider__value { font-family: 'Marcellus', serif; font-size: 1.3rem; letter-spacing: 0.05em; color: var(--color-pink-soft); }

  #tap-hint {
    position: fixed; left: 50%; bottom: 2.2vh; transform: translateX(-50%);
    font-family: 'Marcellus', serif; font-size: 0.85rem; letter-spacing: 0.15em;
    color: rgba(255, 220, 230, 0.75); text-transform: uppercase; z-index: 10;
    opacity: 0; visibility: hidden; transition: opacity 1s var(--ease), visibility 1s var(--ease);
    pointer-events: none; text-align: center; padding: 0 1rem;
  }
  #tap-hint.is-active { opacity: 1; visibility: visible; animation: tapPulse 2.2s ease-in-out infinite; }
  @keyframes tapPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  #debug-error {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 999; max-height: 40vh; overflow: auto;
    background: rgba(120, 0, 20, 0.92); color: #fff; font-family: monospace; font-size: 11px;
    padding: 10px 14px; display: none; white-space: pre-wrap; line-height: 1.4;
  }
</style>
</head>
<body>
  <canvas id="webgl"></canvas>

  <div id="ui-root">
    <section class="stage" id="stage-question-one" data-stage="question-one">
      <h1 class="stage__title">Do you love me that much?</h1>
      <div class="stage__actions">
        <button class="btn btn--yes" id="btn-yes-one" type="button">Yes <span aria-hidden="true">❤</span></button>
        <button class="btn btn--no" id="btn-no-one" type="button">No <span aria-hidden="true">💔</span></button>
      </div>
    </section>

    <section class="stage" id="stage-slider" data-stage="slider">
      <h1 class="stage__title">How much do you love me?</h1>
      <div class="slider">
        <div class="slider__track" id="slider-track">
          <div class="slider__fill" id="slider-fill"></div>
          <div class="slider__handle" id="slider-handle"></div>
        </div>
        <div class="slider__value" id="slider-value">0%</div>
      </div>
    </section>
  </div>

  <div id="tap-hint">✦ toque na tela ✦</div>

  <div id="loading-screen">
    <div class="loading-screen__mark">INFINITY LOVE</div>
    <div class="loading-screen__bar"><div class="loading-screen__bar-fill" id="loading-bar-fill"></div></div>
  </div>

  <div id="debug-error"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
(function () {
  'use strict';

  window.addEventListener('error', function (event) {
    var box = document.getElementById('debug-error');
    box.style.display = 'block';
    box.textContent = 'Erro: ' + event.message + '\n' + (event.filename || '') + ':' + (event.lineno || '');
    var ls = document.getElementById('loading-screen');
    if (ls) ls.classList.add('is-hidden');
  });

  if (typeof THREE === 'undefined' || typeof gsap === 'undefined') {
    var box = document.getElementById('debug-error');
    box.style.display = 'block';
    box.textContent = 'Nao foi possivel carregar Three.js / GSAP pelo CDN. Verifique sua conexao com a internet e recarregue a pagina.';
    document.getElementById('loading-screen').classList.add('is-hidden');
    return;
  }

  function randRange(min, max) { return min + Math.random() * (max - min); }
  function randInt(min, max) { return Math.floor(randRange(min, max + 1)); }
  function randChoice(arr) { return arr[randInt(0, arr.length - 1)]; }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  var HEART_SCALE = 1 / 5.4;
  function heartBoundaryPoint(t, scale) {
    scale = scale || 1;
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x: x * HEART_SCALE * scale, y: y * HEART_SCALE * scale };
  }
  function buildBoundary(samples, scale) {
    var pts = [];
    for (var i = 0; i < samples; i++) pts.push(heartBoundaryPoint((i / samples) * Math.PI * 2, scale));
    return pts;
  }
  function isInsideHeart(boundary, x, y) {
    var inside = false;
    for (var i = 0, j = boundary.length - 1; i < boundary.length; j = i++) {
      var xi = boundary[i].x, yi = boundary[i].y, xj = boundary[j].x, yj = boundary[j].y;
      var intersects = (yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi;
      if (intersects) inside = !inside;
    }
    return inside;
  }
  function sampleFilledHeart(boundary, bound) {
    for (var attempt = 0; attempt < 50; attempt++) {
      var x = randRange(-bound, bound), y = randRange(-bound, bound);
      if (isInsideHeart(boundary, x, y)) return { x: x, y: y };
    }
    return { x: 0, y: 0 };
  }

  function generateShapeA(count) {
    var boundaryBig = buildBoundary(240, 1);
    var positions = new Float32Array(count * 3);
    var colors = new Float32Array(count * 3);

    var fillCount = Math.floor(count * 0.62);
    var edgeCount = Math.floor(count * 0.26);
    var vortexCount = count - fillCount - edgeCount;

    var pink = [1.0, 0.42, 0.63];
    var red = [1.0, 0.18, 0.36];
    var white = [1.0, 0.85, 0.9];

    var idx = 0;

    for (var i = 0; i < fillCount; i++) {
      var p = sampleFilledHeart(boundaryBig, 3);
      var z = randRange(-0.4, 0.4);
      positions[idx * 3] = p.x; positions[idx * 3 + 1] = p.y; positions[idx * 3 + 2] = z;
      var c = Math.random() > 0.5 ? pink : red;
      colors[idx * 3] = c[0]; colors[idx * 3 + 1] = c[1]; colors[idx * 3 + 2] = c[2];
      idx++;
    }

    for (var j = 0; j < edgeCount; j++) {
      var t = (j / edgeCount) * Math.PI * 2;
      var pt = heartBoundaryPoint(t, 1);
      var jitter = randRange(-0.04, 0.04);
      positions[idx * 3] = pt.x + jitter; positions[idx * 3 + 1] = pt.y + jitter; positions[idx * 3 + 2] = randRange(-0.3, 0.45);
      colors[idx * 3] = white[0]; colors[idx * 3 + 1] = white[1] * 0.6; colors[idx * 3 + 2] = white[2] * 0.7;
      idx++;
    }

    var tipY = heartBoundaryPoint(Math.PI, 1).y;
    for (var k = 0; k < vortexCount; k++) {
      var ratio = k / vortexCount;
      var angle = ratio * Math.PI * 10;
      var radius = 0.05 + ratio * 0.55;
      positions[idx * 3] = Math.cos(angle) * radius;
      positions[idx * 3 + 1] = tipY - 0.15 + Math.sin(angle) * radius * 0.5;
      positions[idx * 3 + 2] = randRange(-0.15, 0.15);
      colors[idx * 3] = 1.0; colors[idx * 3 + 1] = 0.5 + ratio * 0.3; colors[idx * 3 + 2] = 0.7;
      idx++;
    }

    return { positions: positions, colors: colors };
  }

  function generateShapeB(count) {
    var positions = new Float32Array(count * 3);
    var colors = new Float32Array(count * 3);

    var bigCount = Math.floor(count * 0.62);
    var smallCount = count - bigCount;

    var idx = 0;
    for (var i = 0; i < bigCount; i++) {
      var t = (i / bigCount) * Math.PI * 2;
      var pt = heartBoundaryPoint(t, 1.05);
      var strokeJitter = randRange(-0.045, 0.045);
      positions[idx * 3] = pt.x + strokeJitter;
      positions[idx * 3 + 1] = pt.y + strokeJitter;
      positions[idx * 3 + 2] = 0.3 + randRange(-0.05, 0.05);
      colors[idx * 3] = 0.85; colors[idx * 3 + 1] = 0.12; colors[idx * 3 + 2] = 0.32;
      idx++;
    }
    for (var j = 0; j < smallCount; j++) {
      var t2 = (j / smallCount) * Math.PI * 2;
      var pt2 = heartBoundaryPoint(t2, 0.46);
      var strokeJitter2 = randRange(-0.03, 0.03);
      positions[idx * 3] = pt2.x + strokeJitter2;
      positions[idx * 3 + 1] = pt2.y + strokeJitter2;
      positions[idx * 3 + 2] = -0.25 + randRange(-0.05, 0.05);
      colors[idx * 3] = 1.0; colors[idx * 3 + 1] = 0.92; colors[idx * 3 + 2] = 0.95;
      idx++;
    }

    return { positions: positions, colors: colors };
  }

  function generateExplosionScatter(count) {
    var positions = new Float32Array(count * 3);
    for (var i = 0; i < count; i++) {
      var r = randRange(0.3, 3.2);
      var theta = randRange(0, Math.PI * 2);
      var phi = Math.acos(randRange(-1, 1));
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);
    }
    return positions;
  }

  var cores = navigator.hardwareConcurrency || 4;
  var isMobile = /Mobi|Android/i.test(navigator.userAgent);
  var perfTier = (isMobile && cores <= 4) ? 2 : (isMobile || cores <= 4) ? 1 : 0;
  var particleMultiplier = [1, 0.6, 0.35][perfTier];

  var canvas = document.getElementById('webgl');
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.FogExp2(0x000000, 0.035);

  var sizes = { width: window.innerWidth, height: window.innerHeight, pixelRatio: Math.min(window.devicePixelRatio, 2) };

  var camera = new THREE.PerspectiveCamera(35, sizes.width / sizes.height, 0.1, 200);
  camera.position.set(0, 0, 12);
  scene.add(camera);

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(sizes.width, sizes.height);
  renderer.setPixelRatio(sizes.pixelRatio);
  if (THREE.ACESFilmicToneMapping) renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;

  var controls = new THREE.OrbitControls(camera, canvas);
  controls.enabled = false;
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.rotateSpeed = 0.5;
  controls.zoomSpeed = 0.6;
  controls.minDistance = 5;
  controls.maxDistance = 16;
  controls.minPolarAngle = 0.35;
  controls.maxPolarAngle = Math.PI - 0.35;

  var ambient = new THREE.AmbientLight(0x2a1520, 0.6);
  scene.add(ambient);
  var keyLight = new THREE.PointLight(0xff5c8a, 10, 30, 2);
  keyLight.position.set(3, 2, 6);
  scene.add(keyLight);

  var HEART_HALF_WIDTH = 1.75;
  var HEART_HALF_HEIGHT = 1.9;
  function updateCameraDistance() {
    var aspect = sizes.width / sizes.height;
    camera.aspect = aspect;
    var vFov = camera.fov * (Math.PI / 180);
    var distForHeight = HEART_HALF_HEIGHT / Math.tan(vFov / 2);
    var hFovTan = Math.tan(vFov / 2) * aspect;
    var distForWidth = HEART_HALF_WIDTH / hFovTan;
    var distance = Math.max(distForHeight, distForWidth, 6) * 1.35;
    controls.maxDistance = Math.max(distance + 4, 16);
    if (!controls.enabled) camera.position.z = distance;
    camera.updateProjectionMatrix();
  }
  updateCameraDistance();

  window.addEventListener('resize', function () {
    sizes.width = window.innerWidth;
    sizes.height = window.innerHeight;
    sizes.pixelRatio = Math.min(window.devicePixelRatio, 2);
    renderer.setSize(sizes.width, sizes.height);
    renderer.setPixelRatio(sizes.pixelRatio);
    updateCameraDistance();
  });

  var tunnelCount = Math.floor(2200 * particleMultiplier);
  var tunnelDepth = 60, tunnelRadius = 5;
  var tunnelGeometry = new THREE.BufferGeometry();
  var tunnelPositions = new Float32Array(tunnelCount * 3);
  var tunnelSizes = new Float32Array(tunnelCount);
  var tunnelSeeds = new Float32Array(tunnelCount);
  for (var ti = 0; ti < tunnelCount; ti++) {
    var tr = randRange(0.4, tunnelRadius) * Math.sqrt(Math.random());
    var tangle = randRange(0, Math.PI * 2);
    tunnelPositions[ti * 3] = Math.cos(tangle) * tr;
    tunnelPositions[ti * 3 + 1] = Math.sin(tangle) * tr;
    tunnelPositions[ti * 3 + 2] = -randRange(0, tunnelDepth);
    tunnelSizes[ti] = randRange(0.6, 2.6);
    tunnelSeeds[ti] = Math.random();
  }
  tunnelGeometry.setAttribute('position', new THREE.BufferAttribute(tunnelPositions, 3));
  tunnelGeometry.setAttribute('aSize', new THREE.BufferAttribute(tunnelSizes, 1));
  tunnelGeometry.setAttribute('aSeed', new THREE.BufferAttribute(tunnelSeeds, 1));

  var tunnelMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uColorA: { value: new THREE.Color(0xff9fc0) },
      uColorB: { value: new THREE.Color(0xff2d55) },
      uPixelRatio: { value: sizes.pixelRatio },
      uOpacity: { value: 0 },
    },
    vertexShader: [
      'attribute float aSize;',
      'attribute float aSeed;',
      'uniform float uPixelRatio;',
      'varying float vSeed;',
      'varying float vDepth;',
      'void main() {',
      '  vSeed = aSeed;',
      '  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);',
      '  vDepth = clamp(1.0 - (-mvPosition.z / 60.0), 0.0, 1.0);',
      '  gl_PointSize = aSize * uPixelRatio * (40.0 / -mvPosition.z);',
      '  gl_Position = projectionMatrix * mvPosition;',
      '}',
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 uColorA;',
      'uniform vec3 uColorB;',
      'uniform float uOpacity;',
      'varying float vSeed;',
      'varying float vDepth;',
      'void main() {',
      '  float d = distance(gl_PointCoord, vec2(0.5));',
      '  if (d > 0.5) discard;',
      '  float glow = smoothstep(0.5, 0.0, d);',
      '  vec3 color = mix(uColorA, uColorB, vSeed);',
      '  float alpha = glow * uOpacity * (0.3 + vDepth * 0.9);',
      '  gl_FragColor = vec4(color, alpha);',
      '}',
    ].join('\n'),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  var tunnelPoints = new THREE.Points(tunnelGeometry, tunnelMaterial);
  tunnelPoints.frustumCulled = false;
  scene.add(tunnelPoints);

  var tunnelSpeed = 0;
  function setTunnelSpeed(v) { tunnelSpeed = v; }
  function setTunnelOpacity(v) { tunnelMaterial.uniforms.uOpacity.value = v; }
  function updateTunnel(delta) {
    if (tunnelSpeed <= 0) return;
    var arr = tunnelGeometry.attributes.position.array;
    var advance = tunnelSpeed * delta;
    for (var i = 0; i < tunnelCount; i++) {
      var i3 = i * 3;
      arr[i3 + 2] += advance;
      if (arr[i3 + 2] > 2) {
        var r = randRange(0.4, tunnelRadius) * Math.sqrt(Math.random());
        var a = randRange(0, Math.PI * 2);
        arr[i3] = Math.cos(a) * r;
        arr[i3 + 1] = Math.sin(a) * r;
        arr[i3 + 2] = -tunnelDepth;
      }
    }
    tunnelGeometry.attributes.position.needsUpdate = true;
  }

  function createLoveTexture() {
    var c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#ff5c8a';
    ctx.font = '700 34px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 18;
    ctx.fillText('LOVE', c.width / 2, c.height / 2);
    return new THREE.CanvasTexture(c);
  }
  var loveTexture = createLoveTexture();
  var matrixLayers = [];
  [
    { z: -14, span: 26, count: 70, speed: 1.2, opacity: 0.16, scale: 0.5 },
    { z: -9, span: 20, count: 55, speed: 1.9, opacity: 0.28, scale: 0.7 },
    { z: -5, span: 15, count: 40, speed: 2.8, opacity: 0.45, scale: 1 },
  ].forEach(function (config) {
    var count = Math.max(6, Math.floor(config.count * particleMultiplier));
    var geometry = new THREE.PlaneGeometry(config.scale, config.scale);
    var material = new THREE.MeshBasicMaterial({ map: loveTexture, transparent: true, opacity: config.opacity, depthWrite: false, blending: THREE.AdditiveBlending });
    var mesh = new THREE.InstancedMesh(geometry, material, count);
    mesh.frustumCulled = false;
    var speeds = new Float32Array(count), phases = new Float32Array(count), columnsX = new Float32Array(count);
    var dummy = new THREE.Object3D();
    for (var i = 0; i < count; i++) {
      speeds[i] = config.speed * (0.7 + Math.random() * 0.6);
      phases[i] = Math.random() * 20;
      columnsX[i] = (Math.random() - 0.5) * config.span;
      dummy.position.set(columnsX[i], phases[i], config.z);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    scene.add(mesh);
    matrixLayers.push({ mesh: mesh, speeds: speeds, phases: phases, columnsX: columnsX, z: config.z, span: config.span, count: count, halfHeight: 12 });
  });
  function updateMatrixRain(delta) {
    var dummy = new THREE.Object3D();
    matrixLayers.forEach(function (layer) {
      for (var i = 0; i < layer.count; i++) {
        layer.phases[i] -= layer.speeds[i] * delta;
        if (layer.phases[i] < -layer.halfHeight) {
          layer.phases[i] = layer.halfHeight;
          layer.columnsX[i] = (Math.random() - 0.5) * layer.span;
        }
        dummy.position.set(layer.columnsX[i], layer.phases[i], layer.z);
        dummy.updateMatrix();
        layer.mesh.setMatrixAt(i, dummy.matrix);
      }
      layer.mesh.instanceMatrix.needsUpdate = true;
    });
  }

  function createTitleSprite(text) {
    var c = document.createElement('canvas');
    c.width = 1024; c.height = 320;
    var ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    var gradient = ctx.createLinearGradient(0, 0, c.width, 0);
    gradient.addColorStop(0, '#ff9fc0');
    gradient.addColorStop(0.5, '#ff2d55');
    gradient.addColorStop(1, '#ff9fc0');
    ctx.fillStyle = gradient;
    ctx.font = 'italic 300 130px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255, 45, 85, 0.85)';
    ctx.shadowBlur = 40;
    ctx.fillText(text, c.width / 2, c.height / 2);
    var texture = new THREE.CanvasTexture(c);
    var material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
    var sprite = new THREE.Sprite(material);
    sprite.scale.set(0.001, 0.001, 1);
    return sprite;
  }

  var HEART_COUNT = Math.floor(2600 * particleMultiplier);
  var shapeAPoints = generateShapeA(HEART_COUNT);
  var shapeBPoints = generateShapeB(HEART_COUNT);
  var explosionScatter = generateExplosionScatter(HEART_COUNT);

  var heartGeometry = new THREE.BufferGeometry();
  heartGeometry.setAttribute('position', new THREE.BufferAttribute(explosionScatter.slice(), 3));
  heartGeometry.setAttribute('color', new THREE.BufferAttribute(shapeAPoints.colors.slice(), 3));
  heartGeometry.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(HEART_COUNT).fill(1.6), 1));
  var heartPhases = new Float32Array(HEART_COUNT);
  for (var hp = 0; hp < HEART_COUNT; hp++) heartPhases[hp] = Math.random() * Math.PI * 2;

  var heartMaterial = new THREE.ShaderMaterial({
    uniforms: { uPixelRatio: { value: sizes.pixelRatio }, uOpacity: { value: 0 } },
    vertexShader: [
      'attribute float aSize;',
      'attribute vec3 color;',
      'uniform float uPixelRatio;',
      'varying vec3 vColor;',
      'void main() {',
      '  vColor = color;',
      '  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);',
      '  gl_PointSize = aSize * uPixelRatio * (60.0 / -mvPosition.z);',
      '  gl_Position = projectionMatrix * mvPosition;',
      '}',
    ].join('\n'),
    fragmentShader: [
      'uniform float uOpacity;',
      'varying vec3 vColor;',
      'void main() {',
      '  float d = distance(gl_PointCoord, vec2(0.5));',
      '  if (d > 0.5) discard;',
      '  float glow = smoothstep(0.5, 0.0, d);',
      '  gl_FragColor = vec4(vColor, glow * uOpacity);',
      '}',
    ].join('\n'),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  var heartPoints = new THREE.Points(heartGeometry, heartMaterial);
  heartPoints.frustumCulled = false;
  heartPoints.visible = false;
  scene.add(heartPoints);

  var heartState = { isShapeA: true, morphing: false, ready: false };

  function startHeartMorph(toPositions, toColors) {
    var fromPositions = heartGeometry.attributes.position.array.slice();
    var fromColors = heartGeometry.attributes.color.array.slice();
    heartState.morphing = true;
    var proxy = { t: 0 };
    gsap.to(proxy, {
      t: 1,
      duration: 2.2,
      ease: 'power3.inOut',
      onUpdate: function () {
        var pos = heartGeometry.attributes.position.array;
        var col = heartGeometry.attributes.color.array;
        for (var i = 0; i < HEART_COUNT; i++) {
          var i3 = i * 3;
          pos[i3] = lerp(fromPositions[i3], toPositions[i3], proxy.t);
          pos[i3 + 1] = lerp(fromPositions[i3 + 1], toPositions[i3 + 1], proxy.t);
          pos[i3 + 2] = lerp(fromPositions[i3 + 2], toPositions[i3 + 2], proxy.t);
          col[i3] = lerp(fromColors[i3], toColors[i3], proxy.t);
          col[i3 + 1] = lerp(fromColors[i3 + 1], toColors[i3 + 1], proxy.t);
          col[i3 + 2] = lerp(fromColors[i3 + 2], toColors[i3 + 2], proxy.t);
        }
        heartGeometry.attributes.position.needsUpdate = true;
        heartGeometry.attributes.color.needsUpdate = true;
      },
      onComplete: function () { heartState.morphing = false; },
    });
  }

  function toggleHeartShape() {
    if (!heartState.ready || heartState.morphing) return;
    heartState.isShapeA = !heartState.isShapeA;
    var target = heartState.isShapeA ? shapeAPoints : shapeBPoints;
    startHeartMorph(target.positions, target.colors);
  }

  function startHeartbeat() {
    var scaleProxy = { v: 1 };
    gsap.to(scaleProxy, {
      v: 1.045, duration: 0.55, ease: 'sine.inOut', yoyo: true, repeat: -1,
      onUpdate: function () { heartPoints.scale.setScalar(scaleProxy.v); keyLight.intensity = 10 * scaleProxy.v; },
    });
  }

  function updateHeartJitter(elapsed) {
    if (!heartPoints.visible || heartState.morphing) return;
    var sizeAttr = heartGeometry.attributes.aSize.array;
    for (var i = 0; i < HEART_COUNT; i += 7) {
      sizeAttr[i] = 1.4 + Math.sin(elapsed * 2 + heartPhases[i]) * 0.5;
    }
    heartGeometry.attributes.aSize.needsUpdate = true;
  }

  var stageQuestionOne = document.getElementById('stage-question-one');
  var actionsEl = stageQuestionOne.querySelector('.stage__actions');
  var yesBtn = document.getElementById('btn-yes-one');
  var noBtn = document.getElementById('btn-no-one');
  var yesScale = 1;
  var lastBehavior = -1;

  function growYes() {
    yesScale = Math.min(yesScale + 0.06, 1.9);
    gsap.to(yesBtn, { scale: yesScale, duration: 0.45, ease: 'back.out(2)' });
  }
  function reactNoButton() {
    var behaviors = ['teleport', 'flee', 'spin', 'shrink', 'orbit'];
    var behavior = randChoice(behaviors);
    while (behavior === lastBehavior && behaviors.length > 1) behavior = randChoice(behaviors);
    lastBehavior = behavior;

    var bounds = actionsEl.getBoundingClientRect();
    var maxX = bounds.width / 2 - 70;
    var maxY = bounds.height / 2 - 24;

    if (behavior === 'teleport') {
      var x = randRange(-maxX, maxX), y = randRange(-maxY * 1.3, maxY * 1.3);
      gsap.to(noBtn, { x: x, y: y, duration: 0.01, onComplete: function () {
        gsap.fromTo(noBtn, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(3)' });
      }});
    } else if (behavior === 'flee') {
      gsap.to(noBtn, { x: randRange(-maxX, maxX), y: randRange(-maxY, maxY), duration: 0.5, ease: 'power3.out' });
    } else if (behavior === 'spin') {
      gsap.to(noBtn, { rotate: '+=' + randInt(180, 720), duration: 0.8, ease: 'power2.inOut' });
    } else if (behavior === 'shrink') {
      gsap.to(noBtn, { scale: randRange(0.35, 0.6), duration: 0.4, ease: 'power2.out', yoyo: true, repeat: 1, repeatDelay: 0.3 });
    } else if (behavior === 'orbit') {
      var radius = randRange(50, Math.min(maxX, maxY)), angle = randRange(0, Math.PI * 2);
      gsap.to(noBtn, { x: Math.cos(angle) * radius, y: Math.sin(angle) * radius, duration: 0.6, ease: 'sine.inOut' });
    }
  }
  function onNoInteract(event) {
    event.preventDefault();
    growYes();
    reactNoButton();
  }
  noBtn.addEventListener('pointerdown', onNoInteract);
  noBtn.addEventListener('pointerenter', onNoInteract);
  yesBtn.addEventListener('click', function (event) {
    event.preventDefault();
    stageQuestionOne.classList.remove('is-active');
    showSlider();
  });

  var stageSlider = document.getElementById('stage-slider');
  var trackEl = document.getElementById('slider-track');
  var fillEl = document.getElementById('slider-fill');
  var handleEl = document.getElementById('slider-handle');
  var valueEl = document.getElementById('slider-value');
  var sliderValue = 0, sliderDragging = false, sliderCompleted = false;

  function renderSlider() {
    fillEl.style.width = sliderValue + '%';
    handleEl.style.left = sliderValue + '%';
    valueEl.textContent = sliderValue + '%';
  }
  function updateSliderFromEvent(event) {
    var bounds = trackEl.getBoundingClientRect();
    var ratio = clamp((event.clientX - bounds.left) / bounds.width, 0, 1);
    sliderValue = Math.round(ratio * 100);
    renderSlider();
    if (sliderValue >= 100 && !sliderCompleted) {
      sliderCompleted = true;
      onSliderFilled();
    }
  }
  trackEl.addEventListener('pointerdown', function (event) {
    sliderDragging = true;
    trackEl.setPointerCapture(event.pointerId);
    updateSliderFromEvent(event);
  });
  window.addEventListener('pointermove', function (event) { if (sliderDragging) updateSliderFromEvent(event); });
  window.addEventListener('pointerup', function () { sliderDragging = false; });

  function showSlider() {
    sliderValue = 0; sliderCompleted = false; renderSlider();
    stageSlider.classList.add('is-active');
  }
  function onSliderFilled() {
    gsap.to(valueEl, { scale: 1.3, duration: 0.25, yoyo: true, repeat: 1, ease: 'power2.out' });
    stageSlider.classList.remove('is-active');

    setTunnelSpeed(16);
    var proxy = { o: 0 };
    gsap.to(proxy, { o: 0.7, duration: 0.3, yoyo: true, repeat: 1, onUpdate: function () { setTunnelOpacity(proxy.o); }, onComplete: function () { setTunnelSpeed(0); } });

    setTimeout(playTitleAndHeart, 500);
  }

  var tapHintEl = document.getElementById('tap-hint');

  function playTitleAndHeart() {
    var titleSprite = createTitleSprite('I LOVE YOU');
    scene.add(titleSprite);

    var targetScaleX = 4.2, targetScaleY = 4.2 * (320 / 1024);
    gsap.to(titleSprite.scale, { x: targetScaleX, y: targetScaleY, duration: 1, ease: 'power3.out' });

    setTimeout(function () {
      gsap.to(titleSprite.scale, {
        x: 0.001, y: 0.001, duration: 0.6, ease: 'power2.in',
        onComplete: function () {
          scene.remove(titleSprite);
          titleSprite.material.map.dispose();
          titleSprite.material.dispose();
        },
      });
      revealHeart();
    }, 2000);
  }

  function revealHeart() {
    heartPoints.visible = true;
    gsap.to(heartMaterial.uniforms.uOpacity, { value: 1, duration: 0.8, ease: 'power1.out' });
    startHeartMorph(shapeAPoints.positions, shapeAPoints.colors);

    setTimeout(function () {
      heartState.ready = true;
      controls.enabled = true;
      startHeartbeat();
      tapHintEl.classList.add('is-active');
    }, 2400);
  }

  window.addEventListener('pointerdown', function (event) {
    if (event.target && event.target.closest && (event.target.closest('.stage') || event.target.closest('#tap-hint'))) return;
    toggleHeartShape();
  });

  var clockStart = performance.now();
  var lastTime = clockStart;

  function tick(now) {
    var delta = Math.min((now - lastTime) / 1000, 1 / 30);
    lastTime = now;
    var elapsed = (now - clockStart) / 1000;

    updateTunnel(delta);
    updateMatrixRain(delta);
    updateHeartJitter(elapsed);
    if (controls.enabled) controls.update();
    renderer.render(scene, camera);

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function playIntro() {
    var barFill = document.getElementById('loading-bar-fill');
    if (barFill) barFill.style.width = '100%';
    setTimeout(function () { document.getElementById('loading-screen').classList.add('is-hidden'); }, 200);

    var proxy = { speed: 0, opacity: 0 };
    var timeline = gsap.timeline({ onComplete: function () { stageQuestionOne.classList.add('is-active'); } });
    timeline.to(proxy, { opacity: 1, duration: 0.8, ease: 'power1.out', onUpdate: function () { setTunnelOpacity(proxy.opacity); } });
    timeline.to(proxy, { speed: 34, duration: 2.1, ease: 'power2.in', onUpdate: function () { setTunnelSpeed(proxy.speed); } }, 0.1);
    timeline.to(proxy, { speed: 0, duration: 1.6, ease: 'power3.out', onUpdate: function () { setTunnelSpeed(proxy.speed); } });
    timeline.to(proxy, { opacity: 0, duration: 1.1, ease: 'power1.inOut', onUpdate: function () { setTunnelOpacity(proxy.opacity); } }, '-=0.5');
  }

  setTimeout(playIntro, 300);
})();
</script>
</body>
